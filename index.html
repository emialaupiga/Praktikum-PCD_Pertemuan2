<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Warna - Space Theme</title>
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #0b0d1b 0%, #1a1c3b 50%, #080914 100%);
    --card-bg: rgba(255, 255, 255, 0.05);
    --card-border: rgba(255, 255, 255, 0.15);
    --text-color: #e2e8f0;
    --accent-cyan: #00f2fe;
    --accent-purple: #9d4edd;
    --button-bg: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    --button-hover: linear-gradient(135deg, #7b2cbf 0%, #9d4edd 100%);
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text-color);
    margin: 0;
    padding: 30px;
    min-height: 100vh;
    box-sizing: border-box;
  }

  .main-card {
    max-width: 950px;
    margin: 0 auto;
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 25px 30px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5),
                0 0 20px rgba(0, 242, 254, 0.1);
  }

  h3 {
    margin-top: 0;
    font-size: 1.8rem;
    color: #fff;
    text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
    border-bottom: 2px solid var(--card-border);
    padding-bottom: 10px;
  }

  #gambar {
    border: 2px solid var(--accent-cyan);
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
    margin-bottom: 15px;
    background-color: #000;
  }

  input[type="file"] {
    margin-bottom: 20px;
    color: var(--text-color);
  }

  input[type="file"]::file-selector-button {
    background: var(--card-bg);
    color: var(--accent-cyan);
    border: 1px solid var(--accent-cyan);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  input[type="file"]::file-selector-button:hover {
    background: var(--accent-cyan);
    color: #000;
    box-shadow: 0 0 10px var(--accent-cyan);
  }

  .button-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 25px;
  }

  button {
    background: var(--card-bg);
    color: #fff;
    border: 1px solid var(--card-border);
    padding: 10px 18px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    backdrop-filter: blur(5px);
  }

  button:hover {
    background: var(--button-bg);
    color: #0b0d1b;
    border-color: transparent;
    box-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
    transform: translateY(-2px);
  }

  .channel-container {
    display: flex;
    gap: 15px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .channel-block {
    text-align: center;
    background: rgba(0, 0, 0, 0.3);
    padding: 10px;
    border-radius: 12px;
    border: 1px solid var(--card-border);
    transition: transform 0.3s ease;
  }

  .channel-block:hover {
    transform: translateY(-3px);
    border-color: var(--accent-purple);
    box-shadow: 0 0 12px rgba(157, 78, 221, 0.4);
  }

  .channel-block canvas {
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 8px;
    display: block;
    margin: 0 auto;
  }

  .channel-block p {
    margin: 8px 0 0 0;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--accent-cyan);
  }
</style>
</head>
<body>

<div class="main-card">
  <h3>Sistem Warna</h3>
  <canvas id="gambar" width="300" height="300"></canvas><br>
  <input type="file" id="file1" accept=".jpg,.jpeg,.png,.bmp"><br>
  
  <div class="button-group">
    <button onclick="showRGBChannels('gambar')">Show RGB Channels</button>
    <button onclick="showCMYKChannels('gambar')">Show CMYK Channels</button>
    <button onclick="showHSVChannels('gambar')">Show HSV Channels</button>
    <button onclick="showYIQChannels('gambar')">Show YIQ Channels</button>
  </div>

  <div id="channels" class="channel-container"></div>
</div>

<script>
let originalImage = null;

function loadImage(fileInput, canvasId) {
  const file = fileInput.files[0];
  if (!file) return;
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext("2d");
  const img = new Image();
  img.onload = function () {
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img, 0, 0);
    originalImage = img;
  };
  img.src = URL.createObjectURL(file);
}

function createChannelCanvas(label, width, height, imgData) {
  const container = document.getElementById("channels");
  const block = document.createElement("div");
  block.className = "channel-block";
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");
  ctx.putImageData(imgData, 0, 0);
  const caption = document.createElement("p");
  caption.textContent = label;
  block.appendChild(canvas);
  block.appendChild(caption);
  container.appendChild(block);
}

function clearChannels() {
  document.getElementById("channels").innerHTML = "";
}

// RGB channels
function showRGBChannels(canvasId) {
  clearChannels();
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext("2d");
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  let R = new ImageData(canvas.width, canvas.height);
  let G = new ImageData(canvas.width, canvas.height);
  let B = new ImageData(canvas.width, canvas.height);

  for (let i = 0; i < imgData.data.length; i += 4) {
    let r = imgData.data[i];
    let g = imgData.data[i + 1];
    let b = imgData.data[i + 2];
    let a = imgData.data[i + 3];

    R.data[i] = r; R.data[i + 1] = 0; R.data[i + 2] = 0; R.data[i + 3] = a;
    G.data[i] = 0; G.data[i + 1] = g; G.data[i + 2] = 0; G.data[i + 3] = a;
    B.data[i] = 0; B.data[i + 1] = 0; B.data[i + 2] = b; B.data[i + 3] = a;
  }
  createChannelCanvas("Red", canvas.width, canvas.height, R);
  createChannelCanvas("Green", canvas.width, canvas.height, G);
  createChannelCanvas("Blue", canvas.width, canvas.height, B);
}

// CMYK channels
function showCMYKChannels(canvasId) {
  clearChannels();
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext("2d");
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  let C = new ImageData(canvas.width, canvas.height);
  let M = new ImageData(canvas.width, canvas.height);
  let Y = new ImageData(canvas.width, canvas.height);
  let K = new ImageData(canvas.width, canvas.height);

  for (let i = 0; i < imgData.data.length; i += 4) {
    let r = imgData.data[i] / 255;
    let g = imgData.data[i + 1] / 255;
    let b = imgData.data[i + 2] / 255;
    let a = imgData.data[i + 3];

    let k = 1 - Math.max(r, g, b);
    let c = (1 - r - k) / (1 - k || 1);
    let m = (1 - g - k) / (1 - k || 1);
    let y = (1 - b - k) / (1 - k || 1);

    C.data[i] = 0; C.data[i + 1] = c * 255; C.data[i + 2] = c * 255; C.data[i + 3] = a;
    M.data[i] = m * 255; M.data[i + 1] = 0; M.data[i + 2] = m * 255; M.data[i + 3] = a;
    Y.data[i] = y * 255; Y.data[i + 1] = y * 255; Y.data[i + 2] = 0; Y.data[i + 3] = a;
    K.data[i] = k * 255; K.data[i + 1] = k * 255; K.data[i + 2] = k * 255; K.data[i + 3] = a;
  }
  createChannelCanvas("Cyan", canvas.width, canvas.height, C);
  createChannelCanvas("Magenta", canvas.width, canvas.height, M);
  createChannelCanvas("Yellow", canvas.width, canvas.height, Y);
  createChannelCanvas("Black", canvas.width, canvas.height, K);
}

// HSV channels
function showHSVChannels(canvasId) {
  clearChannels();
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext("2d");
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  let H = new ImageData(canvas.width, canvas.height);
  let S = new ImageData(canvas.width, canvas.height);
  let V = new ImageData(canvas.width, canvas.height);

  for (let i = 0; i < imgData.data.length; i += 4) {
    let r = imgData.data[i] / 255;
    let g = imgData.data[i + 1] / 255;
    let b = imgData.data[i + 2] / 255;
    let a = imgData.data[i + 3];

    let max = Math.max(r, g, b);
    let min = Math.min(r, g, b);
    let d = max - min;
    let h = 0;

    if (d !== 0) {
      if (max === r) h = ((g - b) / d) % 6;
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
      if (h < 0) h += 360;
    }

    let s = max === 0 ? 0 : d / max;
    let v = max;

    let hueColor = hsvToRgb(h, 1, 1);
    H.data[i] = hueColor[0]; H.data[i + 1] = hueColor[1]; H.data[i + 2] = hueColor[2]; H.data[i + 3] = a;
    S.data[i] = s * 255; S.data[i + 1] = 0; S.data[i + 2] = 0; S.data[i + 3] = a;
    V.data[i] = v * 255; V.data[i + 1] = v * 255; V.data[i + 2] = v * 255; V.data[i + 3] = a;
  }
  createChannelCanvas("Hue", canvas.width, canvas.height, H);
  createChannelCanvas("Saturation", canvas.width, canvas.height, S);
  createChannelCanvas("Value", canvas.width, canvas.height, V);
}

function hsvToRgb(h, s, v) {
  let c = v * s;
  let x = c * (1 - Math.abs((h / 60) % 2 - 1));
  let m = v - c;
  let r, g, b;

  if (h < 60) [r, g, b] = [c, x, 0];
  else if (h < 120) [r, g, b] = [x, c, 0];
  else if (h < 180) [r, g, b] = [0, c, x];
  else if (h < 240) [r, g, b] = [0, x, c];
  else if (h < 300) [r, g, b] = [x, 0, c];
  else [r, g, b] = [c, 0, x];

  return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
}

// YIQ channels
function showYIQChannels(canvasId) {
  clearChannels();
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext("2d");
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  let Yc = new ImageData(canvas.width, canvas.height);
  let I = new ImageData(canvas.width, canvas.height);
  let Q = new ImageData(canvas.width, canvas.height);

  for (let i = 0; i < imgData.data.length; i += 4) {
    let r = imgData.data[i] / 255;
    let g = imgData.data[i + 1] / 255;
    let b = imgData.data[i + 2] / 255;
    let a = imgData.data[i + 3];

    let y = 0.299 * r + 0.587 * g + 0.114 * b;
    let Ii = 0.596 * r - 0.274 * g - 0.322 * b;
    let Qq = 0.211 * r - 0.523 * g + 0.312 * b;

    Yc.data[i] = y * 255; Yc.data[i + 1] = y * 255; Yc.data[i + 2] = y * 255; Yc.data[i + 3] = a;
    I.data[i] = (Ii + 0.5) * 255; I.data[i + 1] = 0; I.data[i + 2] = 0; I.data[i + 3] = a;
    Q.data[i] = 0; Q.data[i + 1] = 0; Q.data[i + 2] = (Qq + 0.5) * 255; Q.data[i + 3] = a;
  }
  createChannelCanvas("Y (Luminance)", canvas.width, canvas.height, Yc);
  createChannelCanvas("I (In-phase)", canvas.width, canvas.height, I);
  createChannelCanvas("Q (Quadrature)", canvas.width, canvas.height, Q);
}

document.getElementById("file1").addEventListener("change", function () {
  loadImage(this, "gambar");
  clearChannels();
});
</script>
</body>
</html>
